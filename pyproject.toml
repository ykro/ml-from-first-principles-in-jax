[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-from-first-principles-in-jax"
version = "0.1.0"
description = "Machine Learning from First Principles in JAX for Software Devs: From Hardcoded Rules to a Two-Layer MLP in 100 Lines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adrián Catalán" }]
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
# Scripts-only repo: install the dependencies, not the experiment folders as packages
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
