<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mlp-dataflow-title mlp-dataflow-desc" id="d-02-mlp-forward-backward-dataflow-root">
        <title id="mlp-dataflow-title">Two-layer MLP forward and backward dataflow in JAX</title>
        <desc id="mlp-dataflow-desc">Dataflow across Input/Init, Hidden Layer, Logits and Loss, and Autodiff Update lanes showing He initialization, affine projection X @ W1 + b1, non-linear GELU activation, stable LogSoftmax cross-entropy, and PyTree parameter update.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-mlp-forward-backward-dataflow-root { --paper: #F7F6F2; --paper-2: #EFECE6; --ink: #0F2547; --muted: #3B5B8C;
      --soft: #5A76A3; --rule: rgba(15,37,71,0.14); --accent: #C59216;
      --accent-text: #9A6F0B; --accent-tint: rgba(197,146,22,0.12); --link: #1D4ED8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #d-02-mlp-forward-backward-dataflow-root { color: var(--ink); font-family: var(--sans); }
      #d-02-mlp-forward-backward-dataflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-02-mlp-forward-backward-dataflow-root .step-number, #d-02-mlp-forward-backward-dataflow-root .step-label, #d-02-mlp-forward-backward-dataflow-root .lane-label, #d-02-mlp-forward-backward-dataflow-root .role-text, #d-02-mlp-forward-backward-dataflow-root .chip-text, #d-02-mlp-forward-backward-dataflow-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #d-02-mlp-forward-backward-dataflow-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; dominant-baseline: central; }
      #d-02-mlp-forward-backward-dataflow-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #d-02-mlp-forward-backward-dataflow-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #d-02-mlp-forward-backward-dataflow-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; dominant-baseline: central; }
      #d-02-mlp-forward-backward-dataflow-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #d-02-mlp-forward-backward-dataflow-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-02-mlp-forward-backward-dataflow-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #d-02-mlp-forward-backward-dataflow-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; dominant-baseline: central; }
      #d-02-mlp-forward-backward-dataflow-root .focal-text { fill: var(--accent-text); }
      #d-02-mlp-forward-backward-dataflow-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #d-02-mlp-forward-backward-dataflow-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
      #d-02-mlp-forward-backward-dataflow-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-02-mlp-forward-backward-dataflow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="#0f2547" fill-opacity="0.10"/></pattern>
          <marker id="d-02-mlp-forward-backward-dataflow-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3B5B8C"/></marker>
          <marker id="d-02-mlp-forward-backward-dataflow-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#C59216"/></marker>
          <marker id="d-02-mlp-forward-backward-dataflow-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#1D4ED8"/></marker>
        </defs>
        <rect width="728" height="436" fill="#F7F6F2"/>
        <rect width="728" height="436" fill="url(#d-02-mlp-forward-backward-dataflow-dots)"/>
        <rect x="0" y="36" width="728" height="80" fill="#0f2547" fill-opacity="0.02"/>

        <!-- Header and lane hairlines -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="728" y2="276" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="0" y1="356" x2="728" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="356" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>

        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">HE INIT</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">AFFINE 1</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="#c59216" fill-opacity="0.20"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">GELU ACT</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">LOGLOSS</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="#0f2547" fill-opacity="0.10"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">BACKPROP</text>
        </g>

        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">INPUT &amp;</text><text x="70" y="84" class="lane-label">PRNG INIT</text>
          <text x="70" y="152" class="lane-label">HIDDEN</text><text x="70" y="164" class="lane-label">REPRESENT</text>
          <text x="70" y="232" class="lane-label">LOGITS &amp;</text><text x="70" y="244" class="lane-label">OBJECTIVE</text>
          <text x="70" y="312" class="lane-label">AUTODIFF</text><text x="70" y="324" class="lane-label">OPTIMIZER</text>
        </g>

        <!-- Connectors before nodes (orthogonal r=8 elbows) -->
        <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#3B5B8C" marker-end="url(#d-02-mlp-forward-backward-dataflow-arr-muted)"/>
        <path d="M358 156 H370" fill="none" stroke="#3B5B8C" marker-end="url(#d-02-mlp-forward-backward-dataflow-arr-muted)"/>
        <path d="M470 156 H524 Q532 156 532 164 V204" fill="none" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-02-mlp-forward-backward-dataflow-arr-accent)"/>
        <path d="M582 236 H636 Q644 236 644 244 V284" fill="none" stroke="#1D4ED8" marker-end="url(#d-02-mlp-forward-backward-dataflow-arr-link)"/>

        <rect x="474" y="138" width="54" height="12" rx="2" fill="#F7F6F2"/>
        <text x="501" y="147" fill="#9A6F0B" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">H[N, 64]</text>

        <!-- Node 1: He / Xavier PRNG Init -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="159" y="53" class="role-text">INI</text>
        <text x="196" y="67" class="node-title">He PRNG Split</text><text x="196" y="79" class="node-sub">sqrt(2 / fan_in)</text><text x="196" y="91" class="node-tool">breaks symmetry</text>
        <rect x="150" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="158" y="104" class="chip-text">DB</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#b8915a"/><text x="234" y="104" class="chip-text">TB</text>

        <!-- Node 2: First Affine Layer -->
        <rect x="258" y="124" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="262" y="128" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="271" y="133" class="role-text">HID</text>
        <text x="308" y="147" class="node-title">Hidden Affine</text><text x="308" y="159" class="node-sub">X @ W1 + b1</text><text x="308" y="171" class="node-tool">shape [1500, 64]</text>
        <rect x="262" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="270" y="184" class="chip-text">TB</text>
        <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="346" y="184" class="chip-text">TB</text>

        <!-- Node 3: Non-Linear GELU Activation (FOCAL) -->
        <rect x="370" y="124" width="100" height="64" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.4"/>
        <rect x="374" y="128" width="18" height="10" rx="3" fill="#c59216" fill-opacity="0.22"/><text x="383" y="133" class="role-text focal-text">ACT</text>
        <text x="420" y="147" class="node-title">jax.nn.gelu</text><text x="420" y="159" class="node-sub">non-linear warp</text><text x="420" y="171" class="node-tool">prevents collapse</text>
        <rect x="374" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="382" y="184" class="chip-text">TB</text>
        <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="184" class="chip-text">TB</text>

        <!-- Node 4: Output Logits + Stable LogSumExp Cross-Entropy -->
        <rect x="482" y="204" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="486" y="208" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="495" y="213" class="role-text">LSE</text>
        <text x="532" y="227" class="node-title">LogSoftmax Loss</text><text x="532" y="239" class="node-sub">H @ W2 + b2</text><text x="532" y="251" class="node-tool">zero exp overflow</text>
        <rect x="486" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="264" class="chip-text">TB</text>
        <rect x="562" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="570" y="264" class="chip-text">FL</text>

        <!-- Node 5: Autodiff value_and_grad + PyTree Update -->
        <rect x="594" y="284" width="100" height="64" rx="6" fill="#EFECE6" stroke="#0f2547" stroke-opacity="0.28"/>
        <rect x="598" y="288" width="18" height="10" rx="3" fill="#0f2547" fill-opacity="0.12"/><text x="607" y="293" class="role-text">OPT</text>
        <text x="644" y="307" class="node-title">value_and_grad</text><text x="644" y="319" class="node-sub">tree.map update</text><text x="644" y="331" class="node-tool">99.47% accuracy</text>
        <rect x="598" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="606" y="344" class="chip-text">FL</text>
        <rect x="674" y="338" width="16" height="8" rx="3" fill="#b8915a"/><text x="682" y="344" class="chip-text">TB</text>

        <!-- Legend: steps -->
        <text x="164" y="373" class="legend-label">STEPS</text>
        <rect x="180" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="192" y="372" class="step-number">01</text><text x="212" y="373" class="legend-text">He Init</text>
        <rect x="272" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="284" y="372" class="step-number">02</text><text x="304" y="373" class="legend-text">Affine</text>
        <rect x="360" y="364" width="24" height="12" rx="6" fill="#c59216" fill-opacity="0.20"/><text x="372" y="372" class="step-number focal-text">03</text><text x="392" y="373" class="legend-text">GELU</text>
        <rect x="456" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="468" y="372" class="step-number">04</text><text x="488" y="373" class="legend-text">Loss</text>
        <rect x="556" y="364" width="24" height="12" rx="6" fill="#0f2547" fill-opacity="0.10"/><text x="568" y="372" class="step-number">05</text><text x="588" y="373" class="legend-text">Update</text>

        <!-- Legend: data types -->
        <text x="164" y="394" class="legend-label">DATA TYPE</text>
        <rect x="180" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="392" class="chip-text">DB</text><text x="202" y="394" class="legend-text">2D ring coordinates</text>
        <rect x="296" y="386" width="16" height="8" rx="3" fill="#b8915a"/><text x="304" y="392" class="chip-text">TB</text><text x="318" y="394" class="legend-text">PyTree tensor</text>
        <rect x="404" y="386" width="16" height="8" rx="3" fill="#9c6b50"/><text x="412" y="392" class="chip-text">FL</text><text x="426" y="394" class="legend-text">Scalar loss + grads</text>
        <text x="524" y="394" class="legend-text">left chip = input · right chip = output</text>

        <!-- Legend: flow -->
        <text x="164" y="416" class="legend-label">FLOW</text>
        <line x1="180" y1="413" x2="204" y2="413" stroke="#3B5B8C" marker-end="url(#d-02-mlp-forward-backward-dataflow-arr-muted)"/><text x="212" y="416" class="legend-text">Forward tensor</text>
        <line x1="308" y1="413" x2="332" y2="413" stroke="#C59216" stroke-width="1.3" marker-end="url(#d-02-mlp-forward-backward-dataflow-arr-accent)"/><text x="340" y="416" class="legend-text">Focal activated features</text>
        <line x1="472" y1="413" x2="496" y2="413" stroke="#1D4ED8" marker-end="url(#d-02-mlp-forward-backward-dataflow-arr-link)"/><text x="504" y="416" class="legend-text">Backward grad dispatch</text>
      </svg>
